services:

  db:
    image: postgres:17-alpine
    container_name: bonfire-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - bonfire_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bonfire-backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bonfire-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  bonfire_data:
