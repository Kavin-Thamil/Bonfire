services:

  db:
    image: postgres:17-alpine
    container_name: bonfire-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: bonfire_user
      POSTGRES_PASSWORD: bonfire_dev123
      POSTGRES_DB: bonfire

    ports:
      - "5433:5432"

    volumes:
      - bonfire_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonfire_user -d bonfire"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bonfire-backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: bonfire_user
      DB_PASSWORD: bonfire_dev123
      DB_NAME: bonfire

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bonfire-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  bonfire_data: